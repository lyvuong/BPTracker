<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#881337" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Scalable Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Scalable Vector Heart Outer Outline -->
  <path d="M256 420 C150 340 86 265 86 190 A 85 85 0 0 1 256 138 A 85 85 0 0 1 426 190 C 426 265 362 340 256 420 Z" 
        fill="rgba(255, 255, 255, 0.12)" 
        stroke="#ffffff" 
        stroke-width="20" 
        stroke-linejoin="round"/>

  <!-- Vector EKG Pulse Waveform -->
  <path d="M 104 260 L 180 260 L 210 180 L 250 340 L 290 220 L 320 260 L 408 260" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#shadow)"/>

  <!-- Accent Pulse Node -->
  <circle cx="290" cy="220" r="14" fill="#ffffff"/>
</svg>
